<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Conspiracy Theory Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>The Conspiracy Theory Archive</h1>
  <p class="subtitle">What are they hiding from us?</p>
  <div class="red-string-divider"></div>
</header>

<main>
  <div class="search-wrap">
    <label for="search" style="display:none">Search</label>
    <input class="search-box" type="text" id="search" placeholder="Search the board...">
  </div>

  <div class="controls" id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="government">Government</button>
    <button class="filter-btn" data-filter="space">Space</button>
    <button class="filter-btn" data-filter="technology">Technology</button>
    <button class="filter-btn" data-filter="history">History</button>
    <button class="filter-btn" data-filter="science">Science</button>
    <button class="filter-btn" data-filter="other">Other</button>
  </div>

  <div class="counter" id="counter"></div>

  <div class="grid" id="grid"></div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-stamp">Classified</div>
    <button class="modal-close" id="modal-close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<footer>
  pinned to the board &mdash; don't let them take it down.
</footer>

<script src="theories.js"></script>
<script src="app.js"></script>
</body>
</html>
