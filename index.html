<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conspiracy Theory Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Conspiracy Theory Archive</h1>
  <p>A collection of conspiracy theories — documented, not endorsed.</p>
</header>

<main>
  <div style="max-width:900px;margin:0 auto;padding:1.5rem 1rem 0">
    <input class="search-box" type="text" id="search" placeholder="Search theories...">
  </div>

  <div class="controls" id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="government">Government</button>
    <button class="filter-btn" data-filter="space">Space</button>
    <button class="filter-btn" data-filter="technology">Technology</button>
    <button class="filter-btn" data-filter="history">History</button>
    <button class="filter-btn" data-filter="science">Science</button>
    <button class="filter-btn" data-filter="other">Other</button>
  </div>

  <div class="counter" id="counter"></div>

  <div class="grid" id="grid"></div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" id="modal-close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<footer>
  Conspiracy Theory Archive &mdash; For entertainment and research purposes only.
</footer>

<script src="theories.js"></script>
<script src="app.js"></script>
</body>
</html>
